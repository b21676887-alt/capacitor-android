name: Extract Backup Zip

on:
  push:
    paths:
      - 'backup.zip'
  workflow_dispatch:

jobs:
  extract:
    name: Extract Backup File
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Unzip Backup File
        run: |
          if [ -f "backup.zip" ]; then
            echo "Unzipping backup.zip into repository..."
            unzip -o backup.zip -d ./
            rm backup.zip
            echo "Unzipped successfully and removed backup.zip"
          else
            echo "Warning: backup.zip not found in workspace."
          fi

      - name: Commit and Push Unzipped Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: Extract backup.zip contents" || echo "No changes to commit"
          git push
